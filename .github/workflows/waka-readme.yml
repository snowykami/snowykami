name: Waka Readme

on:
  # for manual workflow trigger
  workflow_dispatch:
  schedule:
    # runs at 12 AM UTC (8 AM UTC+8)
    - cron: "0 0 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:

      - name: Update README Stats
        uses: anmol098/waka-readme-stats@master
        env:
          # GITHUB_TOKEN cannot read the authenticated user, so specify the user explicitly
          INPUT_GH_USER: ${{ github.repository_owner }}
        with:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
            SHOW_PROJECTS: "False"
