name: Waka Readme

on:
  # for manual workflow trigger
  workflow_dispatch:
  schedule:
    # runs at 12 AM UTC (8 AM UTC+8)
    - cron: "0 0 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:

      # The action pushes via https://<token>@github.com, which only works for PATs;
      # rewrite it to the x-access-token form required by GITHUB_TOKEN.
      # The action container uses $RUNNER_TEMP/_github_home as its HOME.
      - name: Configure Git Credentials
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/_github_home"
          git config --file "$RUNNER_TEMP/_github_home/.gitconfig" \
            "url.https://x-access-token:${TOKEN}@github.com/.insteadOf" "https://${TOKEN}@github.com/"

      - name: Update README Stats
        uses: anmol098/waka-readme-stats@master
        env:
          # GITHUB_TOKEN cannot read the authenticated user, so specify the user explicitly
          INPUT_GH_USER: ${{ github.repository_owner }}
        with:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
            SHOW_PROJECTS: "False"
